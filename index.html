:root{--ink:#3A2A1E;--ink2:#5E4A3B;--paper:#FFFDF7;--cream:#FFF8EA;--sand:#F6E7C8;--yellow:#FFD84A;
  --water:#4F9BD9;--wl:#D6ECFB;--forest:#4E9A4A;--fl:#DDF0D2;--mineral:#7F8794;--ml:#E7E9EE;--red:#C2411E;--pink:#E98A8A;--mint:#BFE6C5;
  --r1:255px 22px 225px 22px/22px 225px 22px 255px;--r2:22px 225px 22px 255px/255px 22px 225px 22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#E9DBBE;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
button{font-family:inherit;color:inherit}
img{-webkit-user-drag:none;pointer-events:none}
.g{font-family:'Gaegu','Jua',sans-serif;font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:var(--cream);border-radius:6px}
.screen{position:absolute;inset:0}
.bg{position:absolute;inset:0}.bg svg{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:50}
#overlay>*{pointer-events:auto}
#overlay>.fpts,#overlay>.spark,#overlay>.ghost,#overlay>.toast,#overlay>.hand,#overlay>.conf{pointer-events:none}
.veil{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:0;background:var(--cream)}
.veil.in{pointer-events:all;animation:vin .35s forwards}.veil.out{animation:vout .4s forwards}
@keyframes vin{to{opacity:1}}@keyframes vout{from{opacity:1}to{opacity:0}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:76px;min-width:180px;padding:0 36px;border:5px solid var(--ink);
  border-radius:var(--r1);background:var(--yellow);font-size:32px;box-shadow:5px 6px 0 var(--ink);cursor:pointer;position:relative}
.btn:active{transform:translate(3px,4px);box-shadow:1px 2px 0 var(--ink)}
.btn.w{background:var(--paper)}.btn.m{background:var(--mint)}.btn.s{background:#CDE7FA}.btn.p{background:#FFC9BC}
.btn.sm{min-height:64px;min-width:120px;font-size:26px;padding:0 24px}
.btn[disabled]{opacity:.45;pointer-events:none}
.rowb{display:flex;gap:24px;justify-content:center;margin-top:24px}

/* 캐릭터 */
.ch{position:relative;display:flex;align-items:flex-end;justify-content:center}
.ch img{max-width:100%;max-height:100%;object-fit:contain}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.hop{animation:hop .8s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px) rotate(-6deg)}}
.wig{animation:wig .5s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* 대화창 */
.dlg{position:absolute;left:30px;right:30px;bottom:22px;height:196px;display:flex;align-items:stretch;z-index:30;cursor:pointer;transition:transform .3s,opacity .3s}
.dlg.hide{transform:translateY(40px);opacity:0;pointer-events:none}
.dlg-port{width:230px;flex:none;position:relative}
.dlg-port .ch{position:absolute;bottom:-6px;left:0;width:224px;height:236px}
.dlg-port.pop .ch{animation:pop .35s}
.dlg-body{flex:1;background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);padding:40px 40px 18px;position:relative;box-shadow:5px 6px 0 #3A2A1E33}
.dlg-name{position:absolute;top:-26px;left:30px;font-size:28px;color:#fff;padding:3px 24px;border-radius:18px 10px 20px 12px;border:4px solid var(--ink);transform:rotate(-2deg)}
.dlg-text{font-family:'Gaegu';font-weight:700;font-size:40px;line-height:1.3;word-break:keep-all}
.dlg-text i{font-style:normal;color:#8A7A6A;font-size:32px}
.dlg-next{position:absolute;right:26px;bottom:10px;font-size:20px;opacity:.6;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{0%{transform:scale(.7) translateY(20px)}70%{transform:scale(1.05)}100%{transform:none}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:100px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.hud-l{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r2);padding:6px 20px;box-shadow:4px 5px 0 #3A2A1E33;min-width:300px}
.hud-l small{display:block;font-size:19px;color:var(--red)}
.hud-l b{font-weight:400;font-size:28px;line-height:1.1}
.hud-c{flex:1;display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:var(--r1);padding:8px 22px;box-shadow:4px 5px 0 #3A2A1E33;min-width:0}
.hud-c .tag{flex:none;background:var(--yellow);border:3px solid var(--ink);border-radius:12px 26px 14px 24px;padding:2px 12px;font-size:20px;transform:rotate(-3deg)}
.hud-c .goal{font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-c.flash{animation:fl .7s}@keyframes fl{40%{transform:scale(1.04);background:#FFF1B8}}
.hud-score{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r2);padding:2px 18px;text-align:right;box-shadow:4px 5px 0 #3A2A1E33;min-width:150px}
.hud-score span{display:block;font-size:16px;color:var(--red)}.hud-score b{font-weight:400;font-size:34px;line-height:1}
.hud-btn{width:70px;height:70px;flex:none;border-radius:18px 26px 16px 24px;border:4px solid var(--ink);background:var(--paper);box-shadow:4px 5px 0 #3A2A1E33;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.1;cursor:pointer;position:relative}
.hud-btn b{font-size:28px;font-weight:400}
.hud-btn i{position:absolute;right:-10px;top:-10px;background:var(--red);color:#fff;font-style:normal;font-size:18px;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;border:3px solid var(--ink)}
.combo{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:21;background:#FFE08A;border:4px solid var(--ink);border-radius:var(--r1);padding:2px 22px;font-size:24px;display:none}
.combo.on{display:block;animation:pop .4s}

/* 모달·토스트·효과 */
.modal{position:absolute;inset:0;background:#2a1d1488;display:grid;place-items:center;opacity:0;transition:opacity .25s;z-index:60}
.modal.show{opacity:1}
.mcard{background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);padding:36px 48px;min-width:560px;max-width:1300px;box-shadow:6px 8px 0 var(--ink);max-height:860px;overflow:auto}
.modal h3{font-family:'Gaegu';font-weight:700;font-size:52px;margin:0 0 14px;text-align:center;line-height:1.1}
.modal p{font-size:28px;line-height:1.5;text-align:center;word-break:keep-all}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:30px;padding:14px 6px;border-bottom:3px dashed #D9C7A5;cursor:pointer;gap:30px}
.tog input{display:none}
.tog i{width:92px;height:50px;border-radius:25px;background:#ddd;border:4px solid var(--ink);position:relative;transition:.2s}
.tog i::after{content:'';position:absolute;left:4px;top:3px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:.2s}
.tog input:checked+i{background:var(--mint)}.tog input:checked+i::after{left:42px}
.toast{position:absolute;left:50%;top:118px;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;padding:14px 34px;border-radius:var(--r1);font-size:28px;transition:.35s;z-index:80;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--red)}.toast.gold{background:var(--yellow);color:var(--ink);border:4px solid var(--ink)}
.fpts{position:absolute;transform:translate(-50%,-50%);font-size:48px;-webkit-text-stroke:3px var(--ink);paint-order:stroke;animation:fup 1.4s forwards;z-index:85;white-space:nowrap}
@keyframes fup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-220%)}}
.spark{position:absolute;width:18px;height:18px;animation:spk .9s ease-out forwards;z-index:84;border:2px solid var(--ink);border-radius:4px}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
.ghost{position:absolute;transform:translate(-50%,-50%) rotate(-4deg) scale(1.06);z-index:95;opacity:.95}
.hand{position:absolute;width:84px;height:104px;z-index:96;margin:-10px 0 0 -30px}
.conf{position:absolute;top:-40px;z-index:70}

/* 해설 */
.ex{position:absolute;left:50%;bottom:26px;transform:translate(-50%,40px);opacity:0;width:1240px;background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);padding:26px 34px 26px;z-index:40;transition:.3s;box-shadow:6px 8px 0 #3A2A1E44}
.ex.show{opacity:1;transform:translate(-50%,0)}
.area .ex,.battle .ex{width:1060px}
.ex.ok{background:#F1FAEC}.ex.no{background:#FFF1EC}
.ex-badge{position:absolute;top:-30px;left:40px;font-size:30px;padding:2px 24px;border-radius:16px 8px 18px 10px;border:4px solid var(--ink);background:#7CC48A;color:#fff;transform:rotate(-2deg)}
.ex.no .ex-badge{background:#E8836E}
.ex-row{display:flex;gap:22px;align-items:center}
.ex-ch{width:150px;height:150px;flex:none}
.ex-text{flex:1}
.ex-text b{font-weight:400;font-size:24px;color:#9A6A72}
.ex-text p{margin:4px 0 0;font-size:31px;line-height:1.45;word-break:keep-all}
.ex-quip{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:3px dashed #D9C7A5}
.ex-quip img{width:64px;height:64px;object-fit:contain}
.ex-quip span{font-family:'Gaegu';font-weight:700;font-size:30px;color:#5E4A3B}
.ex-btn{position:absolute;right:30px;bottom:-34px;min-height:66px;font-size:28px}

/* 배지 획득 */
.bget{position:absolute;inset:0;background:#2a1d14cc;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:.3s;z-index:70}
.bget.show{opacity:1}
.rays{position:absolute;width:1400px;height:1400px;background:repeating-conic-gradient(#FFD84A33 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bmedal{position:relative;animation:medal 1s cubic-bezier(.3,1.6,.5,1)}@keyframes medal{0%{transform:scale(0) rotate(-180deg)}}
.btitle{position:relative;font-family:'Gaegu';font-weight:700;font-size:72px;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke;margin-top:8px}
.bko{position:relative;font-size:30px;color:#fff;margin:4px 0 26px}

/* 타이틀 */
.logo{position:absolute;left:0;right:0;top:44px;text-align:center}
.logo .l0{font-size:30px;color:var(--ink2)}
.logo .l1{font-family:'Gaegu';font-weight:700;font-size:100px;line-height:1;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke;margin-top:4px}
.logo .l1 span{color:#FFD84A}
.logo .l2{display:inline-block;margin-top:14px;font-family:'Gaegu';font-weight:700;font-size:48px;color:#fff;background:var(--red);border:5px solid var(--ink);border-radius:var(--r1);padding:0 40px;box-shadow:5px 6px 0 var(--ink);transform:rotate(-2deg)}
.tchars{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;display:flex;gap:40px;align-items:flex-end}
.tchars .ch{width:230px;height:250px}
.tbtns{position:absolute;left:0;right:0;bottom:40px;display:flex;gap:28px;justify-content:center}

/* 오프닝 */
.opch{position:absolute;left:0;right:0;bottom:250px;display:flex;justify-content:center;gap:90px}
.opch .ch{width:270px;height:290px;transition:transform .35s}
.opch .ch.talk{transform:translateY(-18px) scale(1.06)}
.alert{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:'Gaegu';font-weight:700;font-size:96px;color:#fff;-webkit-text-stroke:10px var(--red);paint-order:stroke;animation:shk .35s infinite;display:none}
.alert.show{display:block}@keyframes shk{25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
.mrev{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:34px}
.mr{width:360px;background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);padding:20px;text-align:center;box-shadow:6px 8px 0 #3A2A1E44;opacity:0;transform:translateY(40px) rotate(-4deg)}
.mr:nth-child(2){border-radius:var(--r1)}
.mr.show{animation:cin .6s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes cin{to{opacity:1;transform:rotate(var(--rot,1deg))}}
.mr .no{font-size:24px;color:var(--red)}.mr h4{font-family:'Gaegu';font-weight:700;font-size:40px;line-height:1.1;margin:6px 0 8px}
.mr .pic{height:130px;display:flex;align-items:center;justify-content:center}.mr .pic img,.mr .pic svg{max-height:120px}
.skip{position:absolute;right:24px;top:24px;z-index:35}

/* 지도 */
.loc{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:5}
.pin{width:150px;height:150px;border-radius:48% 52% 46% 54%;border:5px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:5px 7px 0 #3A2A1E55;position:relative}
.pin img,.pin svg{max-width:104px;max-height:104px}

/* ============================================================
   ART — 그림판 낙서풍 배경 · 아이콘 · 배지
   ============================================================ */
const K = '#3A2A1E';
const Art = (() => {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const R = (a, b) => a + rnd() * (b - a);
  const S = (w = 5) => `stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const wrap = body => `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g filter="url(#wob)">${body}</g></svg>`;

  const sun = (x, y, r = 54, face = true) => `<g ${S(5)}>${[...Array(10)].map((_, i) => { const a = i * 36 * Math.PI / 180; return `<path d="M${x + Math.cos(a) * (r + 12)} ${y + Math.sin(a) * (r + 12)} L${x + Math.cos(a) * (r + 34)} ${y + Math.sin(a) * (r + 34)}" fill="none"/>`; }).join('')}<circle cx="${x}" cy="${y}" r="${r}" fill="#FFD84A"/>${face ? `<circle cx="${x - 16}" cy="${y - 6}" r="5" fill="${K}"/><circle cx="${x + 16}" cy="${y - 6}" r="5" fill="${K}"/><path d="M${x - 12} ${y + 14} q12 10 24 0" fill="none"/>` : ''}</g>`;
  const cloud = (x, y, s = 1, c = '#fff') => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-90 20 q-30 0 -24 -26 q4 -24 34 -20 q6 -34 46 -30 q30 2 38 26 q30 -14 48 10 q18 24 -8 40 z" fill="${c}" ${S(5)}/></g>`;
  const tree = (x, y, s = 1, c = '#7BC46A') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><path d="M-9 0 L-7 -60 L7 -60 L9 0Z" fill="#9A6A3F"/><path d="M-52 -84 q-6 -54 50 -60 q56 2 56 52 q0 44 -54 42 q-50 2 -52 -34z" fill="${c}"/><ellipse cx="-14" cy="-110" rx="12" ry="8" fill="#CDEBB8"/></g>`;
  const pine = (x, y, s = 1, c = '#4E9A4A') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><rect x="-6" y="-18" width="12" height="20" fill="#9A6A3F"/><path d="M0 -140 L-34 -80 L-16 -82 L-46 -30 L-22 -32 L-54 -16 L54 -16 L22 -32 L46 -30 L16 -82 L34 -80Z" fill="${c}"/></g>`;
  const house = (x, y, s = 1, roof = '#E8836E', win = '#CDE7FA') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><rect x="-50" y="-70" width="100" height="70" fill="#FFF3DC"/><path d="M-64 -64 L0 -120 L64 -64Z" fill="${roof}"/><rect x="12" y="-40" width="24" height="40" fill="#B27A47"/><rect x="-36" y="-50" width="26" height="22" fill="${win}"/></g>`;
  const grass = (y0, n, c = '#4E9A4A') => { let s = ''; for (let i = 0; i < n; i++) { const x = R(0, 1600), y = y0 + R(0, 120); s += `<path d="M${x} ${y} l-6 -18 M${x} ${y} l2 -22 M${x} ${y} l9 -16" ${S(4)} stroke="${c}" fill="none"/>`; } return s; };
  const hill = (d, c) => `<path d="${d}" fill="${c}" ${S(6)}/>`;
  const turbineSmall = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><path d="M-6 0 L-3 -120 L3 -120 L6 0Z" fill="#fff"/><path d="M0 -120 L-8 -190 L6 -124Z M0 -120 L64 -90 L4 -114Z M0 -120 L-58 -86 L-6 -116Z" fill="#fff"/><circle cx="0" cy="-120" r="8" fill="#C9C9C9"/></g>`;

  /* ---------- 마을 지도 ---------- */
  function map(lit = 0) {
    seed = 71;
    const night = lit < 6;
    let b = `<rect width="1600" height="900" fill="#9ED2EE"/>`;
    for (let i = 0; i < 26; i++) { const x = R(0, 1600), y = R(0, 900); b += `<path d="M${x} ${y} q12 -8 24 0 q12 -8 24 0" ${S(3)} stroke="#6FAED6" fill="none"/>`; }
    b += `<path d="M60 150 C160 60 480 40 720 70 C960 50 1180 70 1240 150 C1300 260 1280 520 1220 640 C1150 760 1000 820 800 820 C560 840 300 840 160 760 C40 680 0 300 60 150Z" fill="#F2DFB0" ${S(7)}/>`;
    b += `<path d="M90 170 C180 90 480 76 720 100 C960 80 1160 100 1210 170 C1260 270 1240 500 1186 610 C1120 720 990 780 800 784 C570 800 320 800 190 730 C80 650 40 310 90 170Z" fill="#B7E0A0" ${S(5)}/>`;
    // 산(수력)과 화산 땅(지열)
    b += `<path d="M720 330 L820 140 L900 210 L990 120 L1100 330Z" fill="#B9A796" ${S(6)}/><path d="M790 200 l30 -60 l24 26 M960 160 l30 -40 l20 30" fill="#fff" ${S(4)}/>`;
    b += `<path d="M960 520 Q1040 420 1150 470 Q1200 520 1160 570 Q1060 600 960 520Z" fill="#D4A27A" ${S(5)}/>`;
    // 바다 쪽 만(해양)
    b += `<path d="M900 820 Q980 700 1120 720 Q1200 740 1190 800" fill="#8CC8EF" ${S(5)}/>`;
    // 밭(바이오)
    b += `<g ${S(4)}><path d="M180 610 L420 600 L440 760 L160 770Z" fill="#E9C27A"/><path d="M175 650 L425 640 M170 700 L430 690 M165 740 L436 730" fill="none"/></g>`;
    // 강
    b += `<path d="M900 330 C860 420 760 440 700 520 C650 600 620 700 600 800" stroke="#8CC8EF" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M900 330 C860 420 760 440 700 520 C650 600 620 700 600 800" ${S(4)} fill="none" stroke-dasharray="2 40"/>`;
    // 마을 집 (불 켜짐 = 깨운 발전소 수)

function sortGame(area, o) {
  return new Promise(resolve => {
    const wrap = h(`<div class="sortg"><div class="sbins">${o.bins.map(b => `<div class="sbin" data-drop data-bin="${b.id}" style="--bc:${b.color}"><div class="sbl">${esc(b.label)}</div><div class="sin"></div></div>`).join('')}</div><div class="stray"></div></div>`);
    area.appendChild(wrap);

    let left = o.cards.length; DBG.sort = o.cards;
    shuffle(o.cards).forEach(c => {
      const el = h(`<div class="scard" data-id="${c.id}">${c.img ? `<img src="${IMG[c.img]}">` : ''}<span>${esc(c.t)}</span></div>`); $('.stray', wrap).appendChild(el);
      Drag.make(el, {
        onDrop: async (t, it) => {
          const ok = t.dataset.bin === c.bin; const r = answer((o.key || 'sort') + ':' + c.id, o.concept, ok);
          if (ok) {
            Drag.disable(it); Sound.sfx('snap'); const p = centerOf(t); scorePop(r, p.x, p.y - 40);
            const mini = h(`<div class="smini">${esc(c.t)}</div>`); $('.sin', t).appendChild(mini); el.remove();
            o.onOk && o.onOk(c);
            left--; o.progress && o.progress(o.cards.length - left, o.cards.length);
            if (c.exp && o.explainEach) await explain(area, true, c.exp);
            if (!left) { await sleep(300); wrap.remove(); resolve(); }
          } else { Sound.sfx('no'); el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 450); await explain(area, false, c.no || c.exp || '다른 상자를 생각해 봐!'); }

}

function graphSVG(A, B, labels = ['ㄱ 집', 'ㄴ 집']) {
  const X = i => 90 + i * 110, Y = v => 60 + (31 - v) * 85;
  const line = (d, c) => `<path d="${d.map((v, i) => `${i ? 'L' : 'M'}${X(i)} ${Y(v)}`).join(' ')}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>${d.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="9" fill="${c}" stroke="${K}" stroke-width="3"/>`).join('')}`;
  let g = `<rect x="0" y="0" width="720" height="560" fill="#fff" stroke="${K}" stroke-width="5" rx="16"/>`;
  for (let v = 25; v <= 31; v++) g += `<path d="M80 ${Y(v)} H660" stroke="#E6EEF5" stroke-width="2"/><text x="70" y="${Y(v) + 8}" font-size="22" text-anchor="end" font-family="Jua" fill="${K}">${v}</text>`;
  g += `<path d="M80 40 V${Y(25)} H670" stroke="${K}" stroke-width="5" fill="none"/>`;
  ['처음', '1분', '2분', '3분', '4분', '5분'].forEach((t, i) => g += `<text x="${X(i)}" y="${Y(25) + 34}" font-size="22" text-anchor="middle" font-family="Jua" fill="${K}">${t}</text>`);
  g += line(A, '#E8503A') + line(B, '#3E9A4A');
  g += `<text x="680" y="${Y(A[5]) + 8}" font-size="26" font-family="Jua" fill="#E8503A">${labels[0]}</text><text x="680" y="${Y(B[5]) + 8}" font-size="26" font-family="Jua" fill="#3E9A4A">${labels[1]}</text><text x="40" y="34" font-size="22" font-family="Jua" fill="${K}">온도(℃)</text>`;
  return `<svg viewBox="0 0 780 560" width="760" height="546">${g}</svg>`;
}

Screens.opening = async root => {

  const C = {};
  ['dal', 'eong', 'deo'].forEach(c => { C[c] = charEl(c, 'normal', 'bob'); chars.appendChild(C[c]); });
  const setExp = (who, exp, extra = '') => { const n = charEl(who, exp, 'bob talk ' + extra); C[who].replaceWith(n); C[who] = n; Object.values(C).forEach(x => x !== n && x.classList.remove('talk')); };
  const alert = h(`<div class="alert">❄ 열 도둑 경보 ❄</div>`); root.appendChild(alert);
  let skipped = false;
  const skip = h(`<button class="btn sm w skip">건너뛰기 ▶▶</button>`); root.appendChild(skip); onTap(skip, () => { skipped = true; go('map'); });

    { who: 'eong', exp: 'point', text: '틈으로 열이 새는 거야. 단열을 해서 열의 이동을 막아야 해!', fx: () => setExp('eong', 'point') },
    { who: 'dal', exp: 'point', text: '실험실부터 설계도, 어스아워까지! 따끈따끈한 집을 만들러 가자!', fx: () => setExp('dal', 'point') },
  ]);

  chars.style.transition = 'opacity .4s'; chars.style.opacity = '0';

  for (const c of $$('.mr', mr)) { await sleep(220); c.classList.add('show'); Sound.sfx('pick'); }
  await sleep(300);
  await talk(box, [
    { who: 'eong', exp: 'point', text: '미션은 여섯 가지야. 마지막에는 열 도둑이 기다리고 있대.' },
    { who: 'deo', exp: 'cheer', text: '두두두두두두두둗ㄷ!! 열 도둑 잡으러 출동!!' },
  ]);
  if (!skipped) go('map');
};
const INTERLUDE = {
  lab: [{ who: 'deo', exp: 'happy', text: '실험 대성공! 이번엔 스캐너로 열 도둑을 찾으러 가자!' }],
  scan: [{ who: 'eong', exp: 'think', text: '그래프만 남은 수상한 사건이 있대. 탐정이 필요해.' }],

  hour: [{ who: 'system', text: '찬바람이 숭숭… 열 도둑 숭숭이가 나타났어요! 준비됐나요?' }],
};
Screens.map = async (root, params) => {
  if (!P.d) return go('title');
  bg(root, Art5b.title());
  const hud = makeHud(root, { stage: '에코 구조대 MISSION 5', mission: '미션 고르기', goal: '반짝이는 미션 카드를 누르세요', back: false });
  const ids = MISSIONS.map(m => m.id);
  const next = ids.find(id => !P.done(id));
  const tcount = Object.keys(P.d.tre || {}).length;
  const w = h(`<div class="stgs six">${MISSIONS.map((m, i) => {
    const done = P.done(m.id), open = !done && m.id === next;
    return `<div class="stg ${done ? 'done' : open ? 'open' : 'lock'}" data-id="${m.id}" style="--rot:${[-1.5, 1, -1, 1.2, -.8, 1][i]}deg">
      <div class="no">미션 ${i + 1}</div><div class="pic">${ICON(m.icon, 110)}</div><h4>${esc(m.name)}</h4>
      ${done ? `<div class="dn">${Art.check(60)}</div><small>완료! 다시 할 수 있어요</small>` : open ? '<small>눌러서 시작!</small>' : `<div class="lk">${Art.svgIcon('lock', 64)}</div><small>앞 미션을 끝내면 열려요</small>`}</div>`;
  }).join('')}</div>`);
  root.appendChild(w);
  root.appendChild(h(`<div class="trecnt panel">숨은 보물 <b>${tcount}</b>/${Object.keys(TREASURES).length}</div>`));
  $$('.stg', w).forEach(el => onTap(el, () => {
    if (el.classList.contains('lock')) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); toast('앞 미션부터 끝내야 열려요!', 'err'); return; }
    go(el.dataset.id);
  }));
  if (next) hud.goal(`‘${MISSIONS.find(m => m.id === next).name}’ 카드를 누르세요`);
  if (!next) { const b = h(`<button class="btn res-btn">최종 결과 보기 ▶</button>`); root.appendChild(b); onTap(b, () => go('results')); }
  P.d.ev = P.d.ev || {};
  const g = h(`<div class="mapguide2"></div>`); root.appendChild(g);
  const box = dialogBox(g);
  const lastDone = [...ids].reverse().find(id => P.done(id));
  if (lastDone && INTERLUDE[lastDone] && !P.d.ev[lastDone] && next) { P.d.ev[lastDone] = 1; P.save(); await talk(box, INTERLUDE[lastDone]); }
  else {
    const lines = { lab: '첫 번째 미션은 가상 실험실이야! 반짝이는 카드를 눌러 봐.', scan: '열 도둑 스캐너를 켜 보자!', graph: '그래프 탐정 출동!', blue: '똑똑한 집을 설계해 보자!', hour: '어스아워 소등 작전이야!', final: '마지막 대결이야. 숭숭이를 물리치자!' };
    talk(box, [{ who: 'dal', exp: next ? 'point' : 'happy', text: next ? lines[next] : '미션을 모두 끝냈어! 결과를 보러 가자!' }]);
  }
  const t = $('.stg.open', w); if (t) setTimeout(() => demo('map', t, null, '눌러요'), 800);
};

    <div class="tbtns"><button class="btn b-res">최종 결과 보기 ▶</button></div></div>`));
  onTap($('.b-res', root), () => go('results'));
};
function gradeOf(d, st) {
  const ms = MISSIONS.filter(m => d.missions[m.id]).length, tr = Object.keys(d.tre || {}).length;
  const pts = ms / MISSIONS.length * 55 + st.acc * .3 + tr / Object.keys(TREASURES).length * 15;
  const G = [[90, '전설의 단열 박사'], [75, '따끈따끈 집 영웅'], [55, '에너지 효율 탐구왕'], [35, '단열 탐험가'], [0, '단열 새내기']];
  return { name: G.find(g => pts >= g[0])[1], pts: Math.round(pts) };
}
Screens.results = async root => {
  if (!P.d) return go('title');
  bg(root, Art5b.title());
  makeHud(root, { stage: '결과', mission: '오늘의 연구 기록', goal: '배움공책에 오른쪽 문장을 옮겨 써요', back: true });
  const d = P.d, st = P.stats(), w = d.wrong, tre = d.tre || {};
  const gr = gradeOf(d, st);
  const weak = Object.keys(w).sort((a, b) => w[b] - w[a]).slice(0, 2);
  const strong = Object.keys(CONCEPT_NAME).filter(k => !w[k]).slice(0, 3);

  const el = h(`<div class="res res2">
    <div class="panel rcol"><div class="grade"><small>최종 등급</small><b>${esc(gr.name)}</b></div>
      <div class="stats"><div class="stat"><b>${d.score.toLocaleString()}</b><span>점수</span></div><div class="stat"><b>${st.acc}%</b><span>첫 시도 정답률</span></div><div class="stat"><b>${d.best}</b><span>최대 연속 정답</span></div><div class="stat"><b>${MISSIONS.filter(m => d.missions[m.id]).length}/6</b><span>완료한 미션</span></div></div>
      <div class="mbadges">${Object.keys(BADGES).map(k => `<div class="${d.badges.includes(k) ? '' : 'lk'}">${Art.badge(k, 60)}</div>`).join('')}</div>
      <div class="rrow"><b>해결한 곳</b> ${places.filter(p => d.missions[p[0]]).map(p => `<span class="pill">${esc(p[1])}</span>`).join('') || '-'}</div>
      <div class="rrow"><b>찾은 보물 ${Object.keys(tre).length}/${Object.keys(TREASURES).length}</b> ${Object.keys(TREASURES).map(k => `<span class="pill ${tre[k] ? 'got' : 'no'}">${tre[k] ? esc(TREASURES[k].name) : '???'}</span>`).join('')}</div>
      <div class="review"><b style="font-weight:400;color:#2F7D2A">잘 이해한 개념</b> ${strong.map(k => esc(CONCEPT_NAME[k])).join(', ') || '-'}<br><b style="font-weight:400;color:#C2411E">다시 보면 좋은 개념</b> ${weak.length ? weak.map(k => esc(CONCEPT_NAME[k])).join(', ') : '없어요! 모두 잘 이해했어요'}${weak.length ? `<ul>${weak.map(k => `<li>${esc(CONCEPTS[k])}</li>`).join('')}</ul>` : ''}</div></div>
    <div class="panel note rcol"><h3>배움공책 정리</h3><div style="font-size:26px;color:#5E4A3B;margin:2px 0 4px">에너지가 새어 나가지 않는 집은?</div><ul>
      <li>① <b>단열</b>: 열의 이동을 막는 것 (뽁뽁이, 우드록 같은 단열재를 이용)</li>
      <li>② 단열을 한 집 모형은 <b>온도 변화가 작아 에너지 효율이 높다</b>.</li>
      <li>③ <b>단열재와 이중창</b>으로 열의 이동을 막으면 집 안 온도를 유지해 <b>에너지 손실을 줄인다</b>.</li>
      <li>④ <b>태양 빛이나 지열</b> 등으로 에너지를 자체 생산하면 에너지를 효율적으로 이용할 수 있다.</li></ul>
      <div class="rowb"><button class="btn w b-map">미션 지도</button><button class="btn b-again">처음부터 다시 하기</button></div></div></div>`);

};
